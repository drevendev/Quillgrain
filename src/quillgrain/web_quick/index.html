<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ИнкДуэль</title><style>/*QUICK_CSS*/</style>
<header><h1>ИнкДуэль</h1><span id="progress"></span>
<details id="menu"><summary>Меню</summary><nav>
<button id="export">Сохранить ответы</button>
<label class="file">Загрузить ответы<input id="import" type="file" accept="application/json,.json"></label>
<button id="stop">Остановиться и посмотреть итоги</button>
<label class="file" id="key-label" hidden>Открыть ключ для итогов<input id="key" type="file" accept="application/json,.json"></label>
<button id="report-export" hidden>Сохранить сводку без текстов</button>
</nav></details></header>
<p id="status" role="status" aria-live="polite"></p>
<main><p id="purpose"></p><p id="identical" hidden>Тексты совпадают. Доступна оценка «Равно».</p>
<section id="cards" aria-label="Два текста"></section>
<fieldset id="votes"><legend>Какой текст лучше в целом?</legend><div id="vote-buttons"></div>
<small>Клавиши 1–5 · Выбор сохраняет оценку и открывает следующую пару. Комментарии необязательны.</small></fieldset>
<section id="results" hidden aria-label="Итоги"></section></main>
<script id="session" type="application/json">/*QUICK_SESSION*/</script><script>/*QUICK_JS*/</script>
</html>
