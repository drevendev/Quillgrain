name: Synthetic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest -q
      - run: qg pack build --pack examples/synthetic/common --register essay --public --out out/demo
      - run: qg check --draft examples/synthetic/draft.md --context out/demo/context.json --out out/check.json
      - run: python -m build --no-isolation
      - run: python scripts/audit_public.py --source . --archive dist/quillgrain-0.1.0rc2-py3-none-any.whl --archive dist/quillgrain-0.1.0rc2.tar.gz
